<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>顔のパーツにGIFを重ねるアプリ</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:0;
  background:#111;
  color:white;
  font-family:system-ui,sans-serif;
  text-align:center;
  overflow:hidden;
  width:100vw;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}
#stage{
  position:relative;
  width:100vw;
  height:100vh;
  background:#000;
  line-height:0;
  overflow:hidden;
}
#video{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
}

/* 映像と同じように反転させるコンテナ */
#overlay-container{
  position:absolute;
  inset:0;
  transform:scaleX(-1);
  pointer-events:none;
}

/* 各パーツのGIF画像用共通スタイル */
.part-gif{
  position:absolute;
  display:none;
  pointer-events:none;
  transform: translateX(-50%) translateY(-50%); /* 中心合わせ */
}
</style>
</head>
<body>
<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <!-- 各パーツのGIFレイヤー -->
  <div id="overlay-container">
    <img id="atamaGif" class="part-gif" src="./images/atama.gif" alt="Atama GIF">
    <img id="meGif" class="part-gif" src="./images/me.gif" alt="Me GIF">
    <img id="higeGif" class="part-gif" src="./images/hige.gif" alt="Hige GIF">
  </div>
</div>

<script type="module">
import {FaceLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById("video");
const stage = document.getElementById("stage");
const atamaGif = document.getElementById("atamaGif");
const meGif = document.getElementById("meGif");
const higeGif = document.getElementById("higeGif");

let landmarker = null, stream = null, running = false, lastVideoTime = -1;

async function startApp(){
  try{
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    landmarker = await FaceLandmarker.createFromOptions(vision,{
      baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"},
      runningMode:"VIDEO", numFaces:3
    });
    stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}}
    });
    video.srcObject = stream;
    await video.play();
    running = true;
    requestAnimationFrame(loop);
  }catch(err){
    console.error(err);
    alert("カメラを起動できませんでした。HTTPS環境または権限を確認してください。");
  }
}

function loop(){
  if(!running)return;
  if(video.readyState>=2 && landmarker && video.currentTime!==lastVideoTime){
    lastVideoTime=video.currentTime;
    const result=landmarker.detectForVideo(video,performance.now());
    
    if(result.faceLandmarks && result.faceLandmarks.length){
      const lm=result.faceLandmarks[0];
      const stageRect = stage.getBoundingClientRect();
      const scaleX = stageRect.width / video.videoWidth;
      const scaleY = stageRect.height / video.videoHeight;

      const px = p => p.x * video.videoWidth * scaleX;
      const py = p => p.y * video.videoHeight * scaleY;

      // 基準となる顔の幅
      const left = lm[234], right = lm[454];
      const faceWidth = Math.abs(px(right) - px(left));

      // 1. 頭（atama.gif）
      const forehead = lm[10];
      const atamaWidth = faceWidth * 2.8;
      atamaGif.style.display = "block";
      atamaGif.style.width = `${atamaWidth}px`;
      atamaGif.style.left = `${px(forehead)}px`;
      atamaGif.style.top = `${py(forehead) - (faceWidth * -0.4)}px`;

      // 2. 目（me.gif）
      const rightEye = lm[60]; 
      const meWidth = faceWidth * 3.0;
      meGif.style.display = "block";
      meGif.style.width = `${meWidth}px`;
      meGif.style.left = `${px(rightEye)}px`;
      meGif.style.top = `${py(rightEye)}px`;

      // 3. 鼻・口（hige.gif）
      const noseTip = lm[1];
      const higeWidth = faceWidth * 2.0;
      higeGif.style.display = "block";
      higeGif.style.width = `${higeWidth}px`;
      higeGif.style.left = `${px(noseTip)}px`;
      higeGif.style.top = `${py(noseTip) + (faceWidth * -0.1)}px`;

    }else{
      atamaGif.style.display = "none";
      meGif.style.display = "none";
      higeGif.style.display = "none";
    }
  }
  requestAnimationFrame(loop);
}

// ページ読み込みと同時に自動起動
window.addEventListener("load", startApp);
</script>
</body>
</html>
