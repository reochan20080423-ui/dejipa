<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAND X-RAY</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* カメラとキャンバスを画面いっぱいに表示します */
    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }

    video,
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    video {
      opacity: 1.0;
    }

    canvas {
      pointer-events: none;
      z-index: 2;
    }

    .scanline {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      opacity: 0.15;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 4px,
        #29dfff 5px
      );
    }
  </style>
</head>

<body>
  <div class="stage" id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="scanline"></div>
  </div>

  <script type="module">
    import {
      HandLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const stage = document.getElementById("stage");

    let handLandmarker = null;
    let cameraStream = null;
    let running = false;
    let animationId = null;
    let lastVideoTime = -1;

    const boneImg = new Image();
    boneImg.src = "IMG_2472.png";
    let imgLoaded = false;
    boneImg.onload = () => {
      imgLoaded = true;
    };

    // 指の骨データ（一番左側の骨を除く設定）
    const fingerConnections = [
      [0, 1],       // 親指の根元
      [2, 3], [3, 4], // 親指の先側
      [0, 5], [5, 6], [6, 7], [7, 8],
      [5, 9], [9, 10], [10, 11], [11, 12],
      [9, 13], [13, 14], [14, 15], [15, 16],
      [0, 17], [13, 17], [17, 18], [18, 19], [19, 20]
    ];

    // 手のひらの大きな骨の接続データ
    const palmConnections = [
      [0, 9], [0, 17], [5, 13], [9, 17]
    ];

    function resizeCanvas() {
      const rect = stage.getBoundingClientRect();
      canvas.width = Math.round(rect.width);
      canvas.height = Math.round(rect.height);
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    async function initializeModel() {
      if (handLandmarker) return;

      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

      handLandmarker = await HandLandmarker.createFromOptions(
        vision,
        {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numHands: 2,
          minHandDetectionConfidence: 0.5,
          minHandPresenceConfidence: 0.5,
          minTrackingConfidence: 0.5
        }
      );
    }

    async function startCamera() {
      if (running) return;

      try {
        await initializeModel();

        cameraStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: "user",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });

        video.srcObject = cameraStream;
        await video.play();
        resizeCanvas();

        running = true;
        lastVideoTime = -1;

        renderLoop();

      } catch (error) {
        console.error("カメラ起動エラー：", error);
      }
    }

    function getCanvasPoint(landmark) {
      const sourceWidth = video.videoWidth;
      const sourceHeight = video.videoHeight;

      const scale = Math.max(
        canvas.width / sourceWidth,
        canvas.height / sourceHeight
      );

      const renderedWidth = sourceWidth * scale;
      const renderedHeight = sourceHeight * scale;

      const offsetX = (canvas.width - renderedWidth) / 2;
      const offsetY = (canvas.height - renderedHeight) / 2;

      return {
        x: landmark.x * renderedWidth + offsetX,
        y: landmark.y * renderedHeight + offsetY
      };
    }

    function drawBone(p1, p2) {
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const length = Math.hypot(dx, dy);

      if (length < 2) return;

      ctx.save();
      ctx.translate(p1.x, p1.y);
      
      const angle = Math.atan2(dy, dx) - Math.PI / -4;
      ctx.rotate(angle);

      if (imgLoaded) {
        ctx.shadowColor = "#00dfff";
        ctx.shadowBlur = 12;

        const boneWidth = Math.max(12, length * 0.6); // ※指の太さを変えたいときはここ（0.45）を調整できます
        ctx.drawImage(boneImg, 0, -boneWidth / 2, length, boneWidth);
      } else {
        ctx.strokeStyle = "#2ddfff";
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(length, 0);
        ctx.stroke();
      }

      ctx.restore();
    }

    // 手の表裏を判定する関数（手の甲のとき true、手のひらのとき false）
    function isBackOfHand(landmarks, handedness) {
      const wrist = landmarks[0];
      const indexMCP = landmarks[5];
      const pinkyMCP = landmarks[17];

      const v1 = { x: indexMCP.x - wrist.x, y: indexMCP.y - wrist.y };
      const v2 = { x: pinkyMCP.x - wrist.x, y: pinkyMCP.y - wrist.y };
      const z = v1.x * v2.y - v1.y * v2.x;

      if (handedness === "Left") {
        return z < 0;
      } else {
        return z > 0;
      }
    }

    function drawHand(landmarks, isBack) {
      const points = landmarks.map(getCanvasPoint);

      // 1. 指の骨を描画
      for (const [start, end] of fingerConnections) {
        drawBone(points[start], points[end]);
      }

      // 2. 手のひらの大きな骨は手の甲のときだけ表示
      if (isBack) {
        for (const [start, end] of palmConnections) {
          drawBone(points[start], points[end]);
        }
      }
    }

    function renderLoop() {
      if (!running) return;

      if (
        video.readyState >= 2 &&
        video.currentTime !== lastVideoTime
      ) {
        lastVideoTime = video.currentTime;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        try {
          const result = handLandmarker.detectForVideo(
            video,
            performance.now()
          );

          if (result.landmarks && result.landmarks.length > 0) {
            for (let i = 0; i < result.landmarks.length; i++) {
              const landmarks = result.landmarks[i];
              const handedness = result.handednesses[i][0].categoryName;
              const isBack = isBackOfHand(landmarks, handedness);

              drawHand(landmarks, isBack);
            }
          }

        } catch (error) {
          console.error(error);
        }
      }

      animationId = requestAnimationFrame(renderLoop);
    }

    // ページ読み込みと同時に自動でカメラを起動
    window.addEventListener("load", startCamera);
    
    window.addEventListener("beforeunload", () => {
      running = false;
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
      }
    });
  </script>
</body>
</html>
