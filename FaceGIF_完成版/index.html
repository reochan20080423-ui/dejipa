<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>顔のパーツにGIFを重ねるアプリ（複数人対応）</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:0;
  background:#111;
  color:white;
  font-family:system-ui,sans-serif;
  text-align:center;
  overflow:hidden;
  width:100vw;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}
#stage{
  position:relative;
  width:100vw;
  height:100vh;
  background:#000;
  line-height:0;
  overflow:hidden;
}
#video{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
}

/* 映像と同じように反転させるコンテナ */
#overlay-container{
  position:absolute;
  inset:0;
  transform:scaleX(-1);
  pointer-events:none;
}

/* 各パーツのGIF画像用共通スタイル */
.part-gif{
  position:absolute;
  display:none;
  pointer-events:none;
  transform: translateX(-50%) translateY(-50%); /* 中心合わせ */
}
</style>
</head>
<body>
<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <!-- 各パーツのGIFレイヤーをまとめるコンテナ -->
  <div id="overlay-container"></div>
</div>

<script type="module">
import {FaceLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById("video");
const stage = document.getElementById("stage");
const overlayContainer = document.getElementById("overlay-container");

let landmarker = null, stream = null, running = false, lastVideoTime = -1;

// 複数人分のGIF要素セットを格納しておくプール
const faceGroups = [];
const MAX_FACES = 3; // 最大検出人数

// 事前にDOM要素をプールとして作成しておく
function initFaceGroups() {
  for (let i = 0; i < MAX_FACES; i++) {
    const atama = document.createElement("img");
    atama.className = "part-gif";
    atama.src = "./images/atama.gif";
    atama.alt = "Atama GIF";

    const me = document.createElement("img");
    me.className = "part-gif";
    me.src = "./images/me.gif";
    me.alt = "Me GIF";

    const hige = document.createElement("img");
    hige.className = "part-gif";
    hige.src = "./images/hige.gif";
    hige.alt = "Hige GIF";

    overlayContainer.appendChild(atama);
    overlayContainer.appendChild(me);
    overlayContainer.appendChild(hige);

    faceGroups.push({ atama, me, hige });
  }
}

async function startApp(){
  try{
    initFaceGroups();
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    landmarker = await FaceLandmarker.createFromOptions(vision,{
      baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"},
      runningMode:"VIDEO", numFaces: MAX_FACES
    });
    stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}}
    });
    video.srcObject = stream;
    await video.play();
    running = true;
    requestAnimationFrame(loop);
  }catch(err){
    console.error(err);
    alert("カメラを起動できませんでした。HTTPS環境または権限を確認してください。");
  }
}

function loop(){
  if(!running)return;
  if(video.readyState>=2 && landmarker && video.currentTime!==lastVideoTime){
    lastVideoTime=video.currentTime;
    const result=landmarker.detectForVideo(video,performance.now());
    
    // 一旦すべてのグループを非表示にする
    faceGroups.forEach(group => {
      group.atama.style.display = "none";
      group.me.style.display = "none";
      group.hige.style.display = "none";
    });

    if(result.faceLandmarks && result.faceLandmarks.length){
      const stageRect = stage.getBoundingClientRect();
      const scaleX = stageRect.width / video.videoWidth;
      const scaleY = stageRect.height / video.videoHeight;

      const px = p => p.x * video.videoWidth * scaleX;
      const py = p => p.y * video.videoHeight * scaleY;

      // 検出された人数分ループを回す（最大3人）
      result.faceLandmarks.forEach((lm, index) => {
        if (index >= MAX_FACES) return;
        const group = faceGroups[index];

        // 基準となる顔の幅
        const left = lm[234], right = lm[454];
        const faceWidth = Math.abs(px(right) - px(left));

        // 1. 頭（atama.gif）
        const forehead = lm[10];
        const atamaWidth = faceWidth * 2.8;
        group.atama.style.display = "block";
        group.atama.style.width = `${atamaWidth}px`;
        group.atama.style.left = `${px(forehead)}px`;
        group.atama.style.top = `${py(forehead) - (faceWidth * -0.4)}px`; // ※元のコードの構文エラー（マイナス部分）を修正

        // 2. 目（me.gif）
        const rightEye = lm[60]; 
        const meWidth = faceWidth * 3.0;
        group.me.style.display = "block";
        group.me.style.width = `${meWidth}px`;
        group.me.style.left = `${px(rightEye)}px`;
        group.me.style.top = `${py(rightEye)}px`;

        // 3. 鼻・口（hige.gif）
        const noseTip = lm[1];
        const higeWidth = faceWidth * 2.0;
        group.hige.style.display = "block";
        group.hige.style.width = `${higeWidth}px`;
        group.hige.style.left = `${px(noseTip)}px`;
        group.hige.style.top = `${py(noseTip) + (faccWidth * -0.1)}px`; // ※元のコードの構文エラー（プラス部分）を修正
      });
    }
  }
  requestAnimationFrame(loop);
}

// ページ読み込みと同時に自動起動
window.addEventListener("load", startApp);
</script>
</body>
</html>
